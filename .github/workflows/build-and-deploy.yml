name: Build and Deploy

# Release-driven: pushing a version tag (e.g. v2.4.0) runs the test suite and
# builds/pushes the semver-tagged image to GHCR. Cut a release with
# `pnpm release:tag` (creates and pushes the tag from package.json's version).
#
# NOTE: this workflow does NOT currently deploy. The `deploy` job below is
# BROKEN BY DESIGN since ./infra moved to the quinnjr.dev-infra repository —
# see the comment on that job. Until the infra checkout is restored, production
# deploys are MANUAL, run by hand from a clone of quinnjr.dev-infra against the
# image tag this workflow published.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      # Typechecks tests/** and e2e/**, which no other project covers: the app
      # build compiles src/, tsconfig.spec.json covers only src/app/**/*.spec.ts,
      # and Vitest transpiles without checking types. Real errors sat green in
      # the test suite indefinitely — including a service signature that had
      # drifted from its own unit tests.
      - name: Typecheck tests and e2e specs
        run: pnpm typecheck

      - name: Run server unit tests
        run: pnpm test:server:coverage

      - name: Run client unit tests
        run: pnpm test:coverage

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm exec playwright test --project=chromium
        env:
          CI: true

      # Compile check only. A full `pnpm build` here would be thrown away and
      # then repeated verbatim inside the Dockerfile for two platforms in the
      # next job; the type-check catches the same class of error in seconds.
      - name: Type-check application
        run: pnpm exec tsc -p tsconfig.app.json --noEmit

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    permissions:
      contents: read
      packages: write
      # Both are required by actions/attest-build-provenance below: `id-token`
      # for the OIDC token it exchanges with Sigstore, `attestations` to record
      # the attestation against the repository. Without them the step fails on
      # permissions — so fixing the empty `subject-digest` alone would have left
      # provenance just as absent, only now failing the release loudly instead
      # of silently.
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }} # e.g. v2.4.0 (constrained by the trigger filter)
        run: |
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # The digest is an output of the BUILD step, not of docker/metadata-action
      # (which exposes only tags/labels/version/json/bake-file/annotations).
      # This read `steps.meta.outputs.digest`, which resolves to the empty
      # string — the action then errored and `continue-on-error` swallowed it,
      # so every release shipped with no provenance while the workflow stayed
      # green. `continue-on-error` is dropped along with the fix: a silent
      # no-op was the only thing it was protecting.
      #
      # The trade that removal makes, stated so it is a decision rather than an
      # oversight: this step runs AFTER the image is pushed, so a Sigstore or
      # GHCR outage now fails a release whose artefact is already published at
      # an immutable tag. That is the right way round — an unattested image
      # should not report success — and `timeout-minutes` bounds a hung signing
      # call so it fails in minutes rather than at the job limit.
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        timeout-minutes: 10
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Pulumi Deploy (DigitalOcean)
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # BROKEN BY DESIGN, as of the infra consolidation.
    #
    # ./infra moved to github.com/quinnjr/quinnjr.dev-infra (private) under
    # quinnjr.dev/. This job therefore fails at checkout — the directory it
    # expects is not in this repository any more. That was an accepted trade
    # when the infra was consolidated, and the failure is left loud rather than
    # commented out so it is never mistaken for a passing deploy.
    #
    # To restore, add a second checkout of the infra repo and repoint this job:
    #
    #   - uses: actions/checkout@v4
    #     with:
    #       repository: quinnjr/quinnjr.dev-infra
    #       path: infra
    #       token: ${{ secrets.INFRA_REPO_TOKEN }}   # PAT; the repo is private
    #
    # then set working-directory / work-dir to ./infra/quinnjr.dev.
    # The default GITHUB_TOKEN cannot read another repository.
    #
    # Until then, deploy by hand from a clone of quinnjr.dev-infra:
    #   cd quinnjr.dev && pulumi config set quinnjr-dev:imageTag <tag> && pulumi up
    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install infra dependencies
        run: pnpm install --frozen-lockfile

      - name: Pulumi up
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: production
          work-dir: ./infra
          # Self-managed state in a DigitalOcean Spaces (S3-compatible) bucket.
          cloud-url: s3://quinnjr-pulumi?endpoint=nyc3.digitaloceanspaces.com&region=nyc3&s3ForcePathStyle=true
          # Deploy the exact semver just built from the release tag.
          config-map: |
            { "quinnjr-dev:imageTag": { "value": "${{ needs.build-and-push.outputs.version }}" } }
        env:
          # Passphrase secrets provider — decrypts the stack's encrypted config.
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          # Spaces credentials for the S3 state backend.
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_REGION: nyc3
