<div class="grimoire">
  <div class="container mx-auto px-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
      <!-- ── Table of contents ───────────────────────────────────────────── -->
      <aside class="lg:col-span-1">
        <nav class="sidebar card-stone p-4">
          <div class="sidebar-brand">
            <span class="sidebar-brand-text">SLM MANIFESTO</span>
          </div>
          <ol class="sidebar-links">
            @for (chapter of chapters; track chapter.slug) {
              <li>
                <a
                  [routerLink]="['/slm', chapter.slug]"
                  routerLinkActive="text-blue-400"
                  class="sidebar-link"
                  ><i class="fas fa-bookmark sidebar-icon"></i><span>{{ chapter.title }}</span></a
                >
              </li>
            }
          </ol>
        </nav>
      </aside>

      <!-- ── Chapter content ─────────────────────────────────────────────── -->
      <main class="lg:col-span-4">
        <article class="card-stone p-6">
          <router-outlet />
        </article>

        <nav class="chapter-nav" aria-label="Chapter navigation">
          @if (prev(); as p) {
            <a [routerLink]="['/slm', p.slug]" class="chapter-nav-link"
              ><i class="fas fa-chevron-left"></i><span>{{ p.title }}</span></a
            >
          } @else {
            <span></span>
          }
          @if (next(); as n) {
            <a [routerLink]="['/slm', n.slug]" class="chapter-nav-link chapter-nav-next"
              ><span>{{ n.title }}</span
              ><i class="fas fa-chevron-right"></i
            ></a>
          }
        </nav>
      </main>
    </div>
  </div>
</div>
