<nav class="tavern-nav sticky top-0 z-50">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto px-6 py-3">
    <!-- JRQ Shield Monogram Logo -->
    <a
      routerLink="/home"
      routerLinkActive="router-link-active"
      class="nav-logo-link group"
      aria-label="quinnjr.tech — Home"
    >
      <div class="nav-logo">
        <svg
          width="34"
          height="38"
          viewBox="0 0 36 42"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          class="nav-shield"
          aria-hidden="true"
        >
          <path
            d="M18 2L2 9V22C2 31.9 9.4 40.4 18 42C26.6 40.4 34 31.9 34 22V9L18 2Z"
            stroke="#c9a84c"
            stroke-width="1.5"
            fill="rgba(10,10,20,0.85)"
          />
          <text
            x="50%"
            y="59%"
            dominant-baseline="middle"
            text-anchor="middle"
            fill="#c9a84c"
            font-family="Cinzel Decorative, serif"
            font-size="9.5"
            font-weight="700"
          >
            JRQ
          </text>
        </svg>
        <span class="nav-site-name">quinnjr.tech</span>
      </div>
    </a>

    <!-- Mobile Menu Button -->
    <button
      (click)="toggleMenu()"
      type="button"
      class="nav-menu-btn md:hidden"
      aria-controls="navbar-default"
      [attr.aria-expanded]="isMenuOpen()"
    >
      <span class="sr-only">{{ isMenuOpen() ? 'Close main menu' : 'Open main menu' }}</span>
      @if (isMenuOpen()) {
        <svg
          class="w-5 h-5"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      } @else {
        <svg
          class="w-5 h-5"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 17 14"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M1 1h15M1 7h15M1 13h15"
          />
        </svg>
      }
    </button>

    <!-- Navigation Menu -->
    <div [class.nav-menu-open]="isMenuOpen()" class="nav-menu-wrapper" id="navbar-default">
      <ul class="nav-menu">
        @for (item of navbarItems(); track $index) {
          <li>
            @if (item.external) {
              <a
                [href]="item.link"
                target="_blank"
                rel="noopener noreferrer"
                (click)="closeMenu()"
                class="nav-link"
              >
                <span>{{ item.title }}</span>
              </a>
            } @else {
              <a
                [routerLink]="item.link"
                routerLinkActive="nav-link-active"
                (click)="closeMenu()"
                class="nav-link"
              >
                <span class="nav-active-dot"></span>
                <span>{{ item.title }}</span>
              </a>
            }
          </li>
        }
      </ul>
    </div>
  </div>

  <!-- Amber bottom edge line -->
  <div class="nav-border"></div>
</nav>
