<nav class="bg-gray-900/95 backdrop-blur-md border-b border-gray-800 sticky top-0 z-50">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
    <a
      routerLink="/home"
      routerLinkActive="router-link-active"
      class="flex items-center space-x-3 rtl:space-x-reverse group"
    >
      <span
        class="self-center text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 group-hover:from-blue-300 group-hover:via-purple-300 group-hover:to-pink-300 transition-all duration-300"
        >QuinnJR<span class="text-blue-400">.dev</span></span
      >
    </a>
    <button
      (click)="toggleMenu()"
      type="button"
      class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-400 rounded-lg md:hidden hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-700"
      aria-controls="navbar-default"
      [attr.aria-expanded]="isMenuOpen()"
    >
      <span class="sr-only">{{ isMenuOpen() ? 'Close main menu' : 'Open main menu' }}</span>
      @if (isMenuOpen()) {
        <!-- X icon when menu is open -->
        <svg
          class="w-5 h-5"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      } @else {
        <!-- Hamburger icon when menu is closed -->
        <svg
          class="w-5 h-5"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 17 14"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M1 1h15M1 7h15M1 13h15"
          />
        </svg>
      }
    </button>
    <div
      [class.hidden]="!isMenuOpen()"
      class="w-full md:flex md:w-auto md:items-center md:gap-6"
      id="navbar-default"
    >
      <ul
        class="font-medium flex flex-col p-4 md:p-0 mt-4 border border-gray-800 rounded-lg bg-gray-800 md:flex-row md:gap-6 rtl:space-x-reverse md:mt-0 md:border-0 md:bg-transparent"
      >
        @for (item of navbarItems(); track $index) {
          <li>
            @if (item.external) {
              <a
                [href]="item.link"
                target="_blank"
                rel="noopener noreferrer"
                (click)="closeMenu()"
                class="block py-2 px-3 text-gray-300 rounded-lg hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 md:hover:bg-transparent md:p-0 whitespace-nowrap"
              >
                <i [class]="item.icon" class="mr-2"></i>{{ item.title }}
              </a>
            } @else {
              <a
                [routerLink]="item.link"
                routerLinkActive="text-blue-400 bg-gray-800/50 md:bg-transparent"
                (click)="closeMenu()"
                class="block py-2 px-3 text-gray-300 rounded-lg hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 md:hover:bg-transparent md:p-0 whitespace-nowrap"
              >
                <i [class]="item.icon" class="mr-2"></i>{{ item.title }}
              </a>
            }
          </li>
        }
      </ul>
      <div class="md:flex md:ml-6">
        <app-auth-button></app-auth-button>
      </div>
    </div>
  </div>
</nav>
