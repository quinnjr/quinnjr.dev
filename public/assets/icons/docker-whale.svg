<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <style>
    .whale-body { animation: bob 2s ease-in-out infinite; transform-origin: 40px 50px; }
    .spout { animation: spout-puff 2s ease-in-out infinite; transform-origin: 28px 24px; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-4px); }
    }
    @keyframes spout-puff {
      0%, 55%, 100% { opacity: 0; transform: scaleY(0); }
      65%           { opacity: 0.9; transform: scaleY(1); }
      90%           { opacity: 0; transform: scaleY(1.4) translateY(-4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .whale-body { animation: none; }
      .spout { animation: none; opacity: 0; }
    }
  </style>
  <!-- Spout -->
  <g class="spout">
    <line x1="28" y1="24" x2="28" y2="14" stroke="#c9a84c" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="28" y1="14" x2="24" y2="9"  stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="28" y1="14" x2="32" y2="9"  stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="28" y1="14" x2="28" y2="8"  stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- Whale body group -->
  <g class="whale-body">
    <!-- Tail flukes -->
    <path d="M58,55 Q68,48 70,54 Q66,58 62,56 Q64,62 60,62 Q58,58 55,56 Z"
          fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Main body -->
    <path d="M22,40 Q14,44 14,52 Q14,62 28,64 Q42,66 52,60 Q60,55 58,46 Q56,36 46,33 Q36,30 28,34 Q22,36 22,40 Z"
          fill="rgba(10,10,20,0.85)" stroke="#c9a84c" stroke-width="1.5"/>
    <!-- Belly highlight -->
    <path d="M28,58 Q38,63 50,58" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
    <!-- Eye -->
    <circle cx="30" cy="44" r="3" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
    <circle cx="30" cy="44" r="1.2" fill="#c9a84c"/>
    <!-- Blowhole -->
    <ellipse cx="28" cy="36" rx="2.5" ry="1.5" fill="none" stroke="#c9a84c" stroke-width="1.2"/>
    <!-- Flipper -->
    <path d="M36,56 Q30,68 20,66 Q26,60 32,56 Z"
          fill="none" stroke="#c9a84c" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
</svg>
