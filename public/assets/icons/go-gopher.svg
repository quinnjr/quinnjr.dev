<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <style>
    .eye-l { transform-origin: 28px 38px; animation: blink 3.5s ease-in-out infinite; }
    .eye-r { transform-origin: 52px 38px; animation: blink 3.5s ease-in-out infinite; }
    @keyframes blink {
      0%, 88%, 100% { transform: scaleY(1); }
      92%           { transform: scaleY(0.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .eye-l, .eye-r { animation: none; }
    }
  </style>
  <!-- Ears -->
  <circle cx="24" cy="18" r="8" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
  <circle cx="24" cy="18" r="4" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
  <circle cx="56" cy="18" r="8" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
  <circle cx="56" cy="18" r="4" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
  <!-- Head -->
  <ellipse cx="40" cy="46" rx="28" ry="26" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- Left eye -->
  <g class="eye-l">
    <circle cx="28" cy="38" r="6" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
    <circle cx="28" cy="38" r="2.5" fill="#c9a84c"/>
    <circle cx="29.5" cy="36.5" r="1" fill="rgba(10,10,20,0.6)"/>
  </g>
  <!-- Right eye -->
  <g class="eye-r">
    <circle cx="52" cy="38" r="6" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
    <circle cx="52" cy="38" r="2.5" fill="#c9a84c"/>
    <circle cx="53.5" cy="36.5" r="1" fill="rgba(10,10,20,0.6)"/>
  </g>
  <!-- Snout -->
  <ellipse cx="40" cy="54" rx="10" ry="7" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- Nose -->
  <ellipse cx="40" cy="51" rx="3" ry="2" fill="#c9a84c"/>
  <!-- Smile -->
  <path d="M33,58 Q40,64 47,58" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
</svg>
