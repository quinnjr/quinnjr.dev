<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <style>
    @media (prefers-reduced-motion: reduce) {
      .traveler { display: none; }
    }
  </style>
  <defs>
    <!-- Travel path around the node graph -->
    <path id="travel-path" d="M20,20 L60,20 L60,60 L20,60 Z"/>
  </defs>
  <!-- Connection lines -->
  <line x1="20" y1="20" x2="60" y2="20" stroke="#c9a84c" stroke-width="1" opacity="0.45"/>
  <line x1="60" y1="20" x2="60" y2="60" stroke="#c9a84c" stroke-width="1" opacity="0.45"/>
  <line x1="60" y1="60" x2="20" y2="60" stroke="#c9a84c" stroke-width="1" opacity="0.45"/>
  <line x1="20" y1="60" x2="20" y2="20" stroke="#c9a84c" stroke-width="1" opacity="0.45"/>
  <!-- Diagonals -->
  <line x1="20" y1="20" x2="60" y2="60" stroke="#c9a84c" stroke-width="1" opacity="0.2"/>
  <line x1="60" y1="20" x2="20" y2="60" stroke="#c9a84c" stroke-width="1" opacity="0.2"/>
  <!-- Center hub -->
  <circle cx="40" cy="40" r="3" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
  <!-- Corner nodes -->
  <circle cx="20" cy="20" r="5" fill="rgba(10,10,20,0.9)" stroke="#c9a84c" stroke-width="1.5"/>
  <circle cx="60" cy="20" r="5" fill="rgba(10,10,20,0.9)" stroke="#c9a84c" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="5" fill="rgba(10,10,20,0.9)" stroke="#c9a84c" stroke-width="1.5"/>
  <circle cx="20" cy="60" r="5" fill="rgba(10,10,20,0.9)" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- Traveling dot using animateMotion -->
  <circle class="traveler" cx="0" cy="0" r="3.5" fill="#e8c46a" opacity="0.9">
    <animateMotion dur="4s" repeatCount="indefinite">
      <mpath href="#travel-path"/>
    </animateMotion>
  </circle>
</svg>
