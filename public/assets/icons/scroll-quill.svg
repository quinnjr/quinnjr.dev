<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <style>
    .quill { animation: write 3s ease-in-out infinite; transform-origin: 52px 28px; }
    .ink-stroke { animation: draw-ink 3s ease-in-out infinite; }
    @keyframes write {
      0%, 10%  { transform: translate(0, 0) rotate(0deg); }
      30%      { transform: translate(-8px, 10px) rotate(-5deg); }
      60%      { transform: translate(-16px, 16px) rotate(-8deg); }
      80%, 100%{ transform: translate(0, 0) rotate(0deg); }
    }
    @keyframes draw-ink {
      0%, 10%  { stroke-dashoffset: 40; opacity: 0; }
      20%      { opacity: 1; }
      60%      { stroke-dashoffset: 0; opacity: 1; }
      80%, 100%{ stroke-dashoffset: 0; opacity: 0.6; }
    }
    @media (prefers-reduced-motion: reduce) {
      .quill { animation: none; }
      .ink-stroke { animation: none; stroke-dashoffset: 0; opacity: 0.6; }
    }
  </style>
  <!-- Scroll body -->
  <rect x="10" y="22" width="46" height="42" rx="3" fill="rgba(10,10,20,0.88)" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- Scroll top curl -->
  <path d="M10,22 Q10,14 20,14 Q30,14 30,22" fill="rgba(10,10,20,0.7)" stroke="#c9a84c" stroke-width="1.5"/>
  <path d="M56,22 Q56,14 46,14 Q36,14 36,22" fill="rgba(10,10,20,0.7)" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- Scroll bottom curl -->
  <path d="M10,64 Q10,72 20,72 Q30,72 30,64" fill="rgba(10,10,20,0.7)" stroke="#c9a84c" stroke-width="1.5"/>
  <path d="M56,64 Q56,72 46,72 Q36,72 36,64" fill="rgba(10,10,20,0.7)" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- Text lines on scroll -->
  <line x1="18" y1="34" x2="48" y2="34" stroke="#c9a84c" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <line x1="18" y1="40" x2="44" y2="40" stroke="#c9a84c" stroke-width="1" opacity="0.25" stroke-linecap="round"/>
  <line x1="18" y1="46" x2="46" y2="46" stroke="#c9a84c" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
  <line x1="18" y1="52" x2="42" y2="52" stroke="#c9a84c" stroke-width="1" opacity="0.15" stroke-linecap="round"/>
  <!-- Ink being drawn -->
  <path class="ink-stroke"
        d="M22,58 Q28,56 34,58 Q38,59 42,57"
        fill="none" stroke="#e8c46a" stroke-width="1.5" stroke-linecap="round"
        stroke-dasharray="40" stroke-dashoffset="40"/>
  <!-- Quill feather -->
  <g class="quill">
    <!-- Quill body -->
    <path d="M52,28 Q62,12 72,8 Q64,16 58,28 Q56,34 54,36 L52,28 Z"
          fill="rgba(10,10,20,0.7)" stroke="#c9a84c" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Quill barbs -->
    <path d="M62,14 Q60,20 56,28" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.5"/>
    <path d="M67,11 Q63,18 58,27" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.4"/>
    <!-- Quill tip / nib -->
    <path d="M54,36 L50,42 L52,40 L50,44" fill="none" stroke="#c9a84c" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
